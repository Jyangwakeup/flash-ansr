# Tiny smoke version of config.yaml (whole pipeline in minutes; numbers mean nothing).
version: 1
model: models/psaegert/flash-ansr-v25.0-T8-3M
recipe: configs/v25.0-T8.1-3M/dataset_train.yaml
train_recipe: configs/v25.0-T8.1-3M/train.yaml
output: runs/history_benefits/r2_random_vs_model_history_smoke
wandb_group: r2_random_vs_model_history_smoke   # W&B group; run names get the "r2" prefix
# seed: the shared step-0 initialization only; every other stream has its own seed below.
seed: 20261120
data_seed_train: 20261121
data_seed_validation: 20261122
train_seed: 20261123
fit_seed: 20261124
eval_seed: 20261125
threads: 2
workers: 2
train_problems: 6
validation_problems: 4
draws: 20
restarts: 8
keep: null
history_top: 10
max_length: 256
generation_tokens: 128
batch_size: 128
micro_batch: 8
steps: 20
warmup: 5
checkpoint_every: 10
cooldown_from: 10
probe_draws: 5
phase0_draws: 20
phase1_draws: 10
baseline_draws: 30
# Validation (= evaluation) problems follow the author's latest evaluation protocol (srbf 0.11.1
# suite template): same catalog as training, noiseless, 512 support + 512 held-out points.
validation_sampling:
  n_support: 512
  n_validation: 512
  noise: 0.0
